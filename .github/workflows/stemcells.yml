name: Stemcells

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: stemcells-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A sync's quick gates, the same commands a person runs
      # (stemcells/docs/upstream-sync.md): drift, nothing reporting on the
      # person, types, lint, and our tests, each app's with its own config,
      # which carries our substitutes for upstream modules.
      - name: Drift, outbound, types, lint and our tests
        run: stemcells/scripts/sync-upstream --gates drift outbound typecheck lint ours

  # The tab swipe's scroll-phases addon builds with the Mac's own compiler,
  # so it is built and loaded on a Mac.
  scroll-phases:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and load the scroll-phases addon
        run: stemcells/scripts/build-scroll-phases --check

  # Upstream's workflows need runners and secrets this repo doesn't have.
  # A merge from upstream can bring a new one, which GitHub turns on by
  # default: switch it off again and cancel anything it started.
  # It runs on pull requests too: a sync's branch can bring a workflow
  # GitHub hasn't seen, which would otherwise run on its pull request.
  upstream-workflows-off:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Switch off upstream's workflows
        run: |
          gh api "repos/$REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | select(.path | test("/stemcells[^/]*\\.yml$") | not) | "\(.id) \(.path)"' |
          while read -r id path; do
            echo "off: $path"
            gh api -X PUT "repos/$REPO/actions/workflows/$id/disable"
          done
          for status in queued in_progress waiting; do
            gh api "repos/$REPO/actions/runs?status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.path | test("/stemcells[^/]*\\.yml") | not) | .id' |
            while read -r run; do
              echo "cancel: run $run"
              gh api -X POST "repos/$REPO/actions/runs/$run/cancel" || true
            done
          done
